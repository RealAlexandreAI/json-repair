name: golangci-lint
on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - '**.md'
      - 'images/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore: *docs

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
