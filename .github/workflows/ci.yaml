name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - '**.md'
      - 'images/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERBOSE: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: |
          go test -count=1 -race ./...
